<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Скриншот для Chrome Web Store</title>
  <style>
    /* 1280×800 — рекомендуемый размер скриншота в Chrome Web Store. Без полей и скруглений: кадр во всю ширину. */
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body {
      position: relative;
      background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 55%, #c7d2fe 100%);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #0f172a;
    }
    .caption { position: absolute; left: 80px; top: 0; bottom: 0; width: 400px; display: flex; flex-direction: column; justify-content: center; }
    .caption img { width: 64px; height: 64px; margin-bottom: 30px; }
    .caption h1 { margin: 0 0 22px; font-size: 46px; line-height: 1.12; font-weight: 700; }
    .caption p { margin: 0; font-size: 23px; line-height: 1.4; color: #334155; }
    iframe {
      position: absolute; left: 520px; top: 30px; width: 560px; height: 580px;
      transform: scale(1.28); transform-origin: 0 0;
      border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; box-shadow: 0 10px 40px rgba(15, 23, 42, .22);
    }
  </style>
</head>
<body>
  <div class="caption"><img src="../assets/icon.svg" alt=""><h1 id="t"></h1><p id="d"></p></div>
  <script>
    // ?shot=1…5 — какой кадр, ?lang=ru|en — язык подписей и интерфейса. Подписи пишем про выгоду, а не про устройство выдачи: это витрина магазина.
    // frame — параметры для preview.html (мок браузера), q — запрос в строке поиска, back — id вкладки для «Вернуться».
    const SHOTS = {
      1: { ru: { title: 'Любая вкладка — за секунду', text: 'Печатайте название, сайт или адрес. Ищем сразу во всех группах и окнах.' },
           en: { title: 'Any tab in a second', text: 'Type a title, site or address. We search all groups and windows at once.' },
           q: 'github' },
      2: { ru: { title: 'Свежие вкладки — первыми', text: 'Только что работали с вкладкой? Режим «Активность» поднимет её наверх.' },
           en: { title: 'Recent tabs come first', text: 'Just worked on a tab? Switch to Activity and it jumps to the top.' },
           frame: '&sort=activity' },
      3: { ru: { title: 'Похожие вкладки не спутаются', text: 'У похожих вкладок виден адрес, а нужная окажется в начале списка.' },
           en: { title: 'Look-alike tabs, no mix-ups', text: 'Similar tabs show their address, and the one you need comes first.' },
           frame: '&sort=activity', q: 'jaeger' },
      4: { ru: { title: 'Назад — одним нажатием', text: 'Расширение помнит, откуда вы пришли. Откройте окно и нажмите Enter — вы снова на месте.' },
           en: { title: 'Back in one keystroke', text: 'The extension remembers where you came from. Open it, press Enter — and you are back.' },
           back: '4' },
      5: { ru: { title: 'Ваши вкладки — только ваши', text: 'Расширение работает только в вашем браузере: данные о вкладках никуда не отправляются.' },
           en: { title: 'Your tabs stay yours', text: 'Works only inside your browser: tab data is never sent anywhere.' },
           frame: '&firstrun' },
    };
    // ?lang=en — английские подписи и английский интерфейс; по умолчанию русский.
    const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ru';
    const shot = SHOTS[new URLSearchParams(location.search).get('shot')] || SHOTS[1];
    document.documentElement.lang = lang;
    document.getElementById('t').textContent = shot[lang].title;
    document.getElementById('d').textContent = shot[lang].text;
    sessionStorage.clear();
    if (shot.back) sessionStorage.setItem('returnTo', shot.back);
    const frame = document.createElement('iframe');
    frame.src = 'preview.html?store&lang=' + lang + (shot.frame || '');
    const SCALE = 1.28;
    frame.addEventListener('load', () => setTimeout(() => {
      const doc = frame.contentDocument;
      const input = doc.querySelector('.query');
      // На кадре с уведомлением убираем рамку фокуса с кнопки: в магазине она выглядит как дефект.
      if (!input) doc.activeElement?.blur?.();
      if (shot.q && input) {
        input.value = shot.q;
        input.dispatchEvent(new Event('input'));
      }
      // Как в браузере: окно расширения ужимается по содержимому. Центрируем его по вертикали.
      setTimeout(() => {
        const h = Math.min(doc.getElementById('app').scrollHeight, 580);
        frame.style.height = h + 'px';
        frame.style.top = Math.round((800 - h * SCALE) / 2) + 'px';
      }, 150);
    }, 300));
    document.body.append(frame);
  </script>
</body>
</html>
