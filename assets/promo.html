<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Промо-картинка для каталога. Размер — из ?w=&h= (по умолчанию 300×188), всё масштабируется от высоты. ?notext=1 — без текста. -->
<style>
  html, body { margin: 0; overflow: hidden; }
  .promo {
    --h: 188px;
    box-sizing: border-box;
    display: flex; align-items: center; gap: calc(var(--h) * 0.1);
    padding: 0 calc(var(--h) * 0.13);
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 55%, #c7d2fe 100%);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #0f172a;
  }
  .promo img { width: calc(var(--h) * 0.42); height: calc(var(--h) * 0.42); flex: none; }
  /* Без текста: плитка Chrome Web Store одна на все языки, слов на ней быть не должно. */
  .promo.notext { justify-content: center; padding: 0; }
  .promo.notext img { width: calc(var(--h) * 0.52); height: calc(var(--h) * 0.52); }
  .promo.notext .txt { display: none; }
  .title { font-size: calc(var(--h) * 0.125); font-weight: 700; line-height: 1.1; }
  .tagline { margin-top: calc(var(--h) * 0.05); font-size: calc(var(--h) * 0.075); line-height: 1.3; color: #334155; }
</style>
</head>
<body>
  <div class="promo" id="promo">
    <img src="icon.svg" alt="">
    <div class="txt">
      <div class="title">Поиск по вкладкам</div>
      <div class="tagline">Быстрый поиск среди бесконечных вкладок</div>
    </div>
  </div>
  <script>
    const p = new URLSearchParams(location.search);
    const w = +p.get('w') || 300, h = +p.get('h') || 188;
    const el = document.getElementById('promo');
    el.style.width = w + 'px';
    el.style.height = h + 'px';
    el.style.setProperty('--h', h + 'px');
    if (p.get('notext')) el.classList.add('notext');
  </script>
</body>
</html>
